# SIL spike: tests the car script against vcu_dummy over shared memory, then
# builds vcu_dummy.exe and uploads the kit (download it from the run's page).
name: spike

on:
  push:
    paths: ["spike/**", ".github/workflows/spike.yml"]
  pull_request:
    paths: ["spike/**", ".github/workflows/spike.yml"]
  workflow_dispatch:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q luajit gcc-mingw-w64-x86-64

      - name: Test the car script against vcu_dummy
        run: make -C spike test

      - name: Build the kit
        run: make -C spike kit

      - uses: actions/upload-artifact@v4
        with:
          name: bfr_vcu_spike
          path: spike/build/bfr_vcu_spike/
