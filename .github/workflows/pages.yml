# Deploy MK12 Profile Studio to GitHub Pages, synced with vendor/mk12-vcu/profiles/base.yaml.
# Enable once in repo Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: ["master", "feature/sil-vcu"]
    paths:
      - "sil/build_pages.py"
      - "vendor/mk12-vcu"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Profile Studio
        run: python3 sil/build_pages.py sil/build/pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sil/build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
