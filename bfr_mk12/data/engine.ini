[HEADER]
VERSION=1
POWER_CURVE=/Motor/base.lut		
COAST_CURVE=FROM_COAST_REF		; coast curve. can define 3 different options (coast reference, coast values for mathematical curve, coast curve file)

[MAP]
DEFAULT=1    
MAP_0=Torque/140nm.lut
MAP_1=Torque/120nm.lut  
MAP_2=Torque/90nm.lut
MAP_3=Torque/70nm.lut

[ENGINE_DATA]
ALTITUDE_SENSITIVITY=0		
INERTIA=0.085774			
LIMITER=6000				
LIMITER_HZ=12
MINIMUM=1
RESPONSE_TIME=0.01 ;assuming 100Hz polling on pedal inputs

[COAST_REF]
RPM=5500						; rev number reference
TORQUE=0						; engine braking torque value in Nm at rev number reference
NON_LINEARITY=0					; coast engine brake from ZERO to TORQUE value at rpm with linear (0) to fully exponential (1)

[DAMAGE]
RPM_THRESHOLD=11600		
RPM_DAMAGE_K=1	

